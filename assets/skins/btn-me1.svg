<?xml version="1.0" encoding="UTF-8"?>
<!-- ME1 button skin (9-slice, 40x24, slice 16px left/right), measured on refs/me1/ea "Default" (151x24):
     1px frame light cyan at the ends, blue in the middle; light-cyan end zones fading inwards (~5px bright, gone by ~15px);
     dark navy inner panel inset 4px/3px with 9x3px chamfered corners, so the light zone reads as a bracket at each corner. -->
<svg xmlns="http://www.w3.org/2000/svg" width="40" height="24" viewBox="0 0 40 24" preserveAspectRatio="none">
  <defs>
    <linearGradient id="z" x1="0" y1="0" x2="40" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a6dcf1"/><stop offset=".1" stop-color="#5fb3dc"/><stop offset=".25" stop-color="#2a7ab3"/><stop offset=".4" stop-color="#1a5c93"/>
      <stop offset=".6" stop-color="#1a5c93"/><stop offset=".75" stop-color="#2a7ab3"/><stop offset=".9" stop-color="#5fb3dc"/><stop offset="1" stop-color="#a6dcf1"/></linearGradient>
    <linearGradient id="f" x1="0" y1="0" x2="40" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a6dcf1"/><stop offset=".33" stop-color="#7cc6e8"/><stop offset=".42" stop-color="#2a93d2"/>
      <stop offset=".58" stop-color="#2a93d2"/><stop offset=".67" stop-color="#7cc6e8"/><stop offset="1" stop-color="#a6dcf1"/></linearGradient>
    <linearGradient id="p" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#123f6e"/><stop offset=".55" stop-color="#134879"/><stop offset="1" stop-color="#1a5c95"/></linearGradient>
  </defs>
  <rect x=".5" y=".5" width="39" height="23" fill="url(#z)" stroke="url(#f)"/>
  <path d="M14 3H26L35 6V18L26 21H14L5 18V6Z" fill="url(#p)"/>
</svg>
